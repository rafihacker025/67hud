<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Editor</title>
<style>
:root{
  --bg:#262626; --line:rgba(255,255,255,.13); --major:rgba(255,255,255,.28);
  --mint:#8fffc1;
  /* HUD menu size - change these to resize the opened menu */
  --panel-w:104px; --panel-h:96px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:"DejaVu Sans",Verdana,system-ui,sans-serif}
#stage{
  position:fixed;inset:0;background-color:var(--bg);
  background-image:
    linear-gradient(var(--major) 2px,transparent 2px),
    linear-gradient(90deg,var(--major) 2px,transparent 2px),
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:67.5px 67.5px,67.5px 67.5px,13.5px 13.5px,13.5px 13.5px;
}
#stage.nogrid{background-image:none}

.bar{position:fixed;display:flex;gap:7px}
#top{top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:100%;padding:0 4px;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#bottomRight{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}

.btn{
  flex:none;position:relative;width:27px;height:27px;border-radius:32.4%;background:#000;border:0;padding:0;
  cursor:pointer;display:block;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .15s,box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{transform:translateY(-1px) scale(1.08);background:#0d0d0d}
.btn:active{transform:scale(.9)}
.btn svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.btn.on{background:#1b1b1b;box-shadow:0 0 0 1.5px var(--c) inset}

/* ---------- HUD menu (bottom-left) ---------- */
#hud{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:5}
#panel{
  background:#000;border-radius:13px;overflow-x:hidden;overflow-y:hidden;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--mint) transparent;
  width:27px;height:0;opacity:0;
  transition:width .55s cubic-bezier(.34,1.45,.5,1),height .6s cubic-bezier(.34,1.35,.5,1),border-radius .5s ease,opacity .2s ease;
}
#hud.open #panel{width:var(--panel-w);height:var(--panel-h);opacity:1;border-radius:12px;overflow-y:auto}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:var(--mint);border-radius:2px}
#hudList{padding:5px 10px;width:var(--panel-w)}

/* every list entry is just a div with class "hud-item" */
.hud-item{
  color:var(--mint);font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
  opacity:0;transform:translateY(7px);
  transition:opacity .25s ease,transform .35s cubic-bezier(.34,1.56,.64,1);
}
.hud-item:hover{text-decoration:underline}
#hud.open .hud-item{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 30ms + 80ms)}

#toggle .plus,#toggle .caret{transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .25s}
#toggle .plus{opacity:1;transform:rotate(0)}
#toggle .caret{opacity:0;transform:rotate(-90deg) scale(.5)}
#hud.open #toggle .plus{opacity:0;transform:rotate(90deg) scale(.5)}
#hud.open #toggle .caret{opacity:1;transform:rotate(0) scale(1)}

#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);background:#000;color:var(--mint);
  padding:5px 10px;border-radius:9px;font-size:11px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="top" class="bar"></div>

<div id="hud">
  <div id="panel">
    <!-- ===== YOUR HUD LIST: add a line like <div class="hud-item">My name</div> ===== -->
    <div id="hudList">
      <div class="hud-item">HUD GUI 1</div>

      <div class="hud-item">HUD GUI 7</div>
      <div class="hud-item">HUD GUI 8</div>
      <div class="hud-item">HUD GUI 9</div>
    </div>
    <!-- ======================================================================= -->
  </div>
  <button class="btn" id="toggle" aria-label="Toggle HUD menu"></button>
</div>
<div id="bottomRight" class="bar"></div>

const NS='http://www.w3.org/2000/svg';
function mkSvg(vb,paths){
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',vb);
  paths.forEach(([d,f])=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill',f);s.appendChild(p)});
  return s;
}
const toast=document.getElementById('toast');let tt;
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1200)}
const stage=document.getElementById('stage');

function build(host,items){
  items.forEach(([label,vb,paths,act])=>{
    const b=document.createElement('button');
    b.className='btn';b.title=label;b.setAttribute('aria-label',label);
    b.style.setProperty('--c',paths[0][1]);
    b.appendChild(mkSvg(vb,paths));
    if(act==='align')b.dataset.g='a';
    b.onclick=()=>{
      if(act==='tog')b.classList.toggle('on');
      if(act==='align'){host.querySelectorAll('[data-g="a"]').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
      if(act==='gridOn')stage.classList.remove('nogrid');
      if(act==='gridOff')stage.classList.add('nogrid');
      say(label);
    };
    host.appendChild(b);
  });
}
build(document.getElementById('top'),TOP);
build(document.getElementById('bottomRight'),BOTTOM);

/* + / ^ toggle button */
const hud=document.getElementById('hud'),toggle=document.getElementById('toggle');
const plus=mkSvg(PLUS[0],[[PLUS[1],PLUS[2]]]);plus.classList.add('plus');
const caret=document.createElementNS(NS,'svg');caret.setAttribute('viewBox','0 0 54 54');caret.classList.add('caret');
caret.innerHTML='<path d="M15 32 27 21.5 39 32" fill="none" stroke="'+PLUS[2]+'" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>';
toggle.append(plus,caret);

/* HUD list helpers */
const list=document.getElementById('hudList');
function indexItems(){list.querySelectorAll('.hud-item').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,12)))}
function addHudItem(name,onClick){          // call from JS: addHudItem('My thing', ()=>{...})
  const d=document.createElement('div');d.className='hud-item';d.textContent=name;
  if(onClick)d._cb=onClick;list.appendChild(d);indexItems();return d;
}
window.addHudItem=addHudItem;
list.addEventListener('click',e=>{
  const it=e.target.closest('.hud-item');if(!it)return;
  if(it._cb)it._cb(it);
  say(it.textContent.trim());
});
indexItems();
toggle.onclick=()=>{indexItems();hud.classList.toggle('open')};
</script>
